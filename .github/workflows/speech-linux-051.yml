name: Speech 0.5.1 Linux packages
on:
  push:
    branches: [qa/speech-051-linux]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c10a9497bda6f4d77e5d4ff38eb223f4797f5736
          persist-credentials: false
      - name: Build in Ubuntu 22.04
        env:
          CARGO_BUILD_JOBS: 2
        run: bash scripts/build-linux-docker.sh "$RUNNER_TEMP/packages" "$RUNNER_TEMP/speech-cache"
      - name: Check packages
        working-directory: ${{ runner.temp }}/packages
        run: |
          set -eu
          test "$(dpkg-deb -f ./*.deb Version)" = 0.5.1
          test "$(dpkg-deb -f ./*.deb Architecture)" = amd64
          test -s Speech-Studio-0.5.1-linux-x86_64-experimental.AppImage
          sha256sum -- *.deb *.AppImage > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: speech-051-linux
          path: |
            ${{ runner.temp }}/packages/*.deb
            ${{ runner.temp }}/packages/*.AppImage
            ${{ runner.temp }}/packages/SHA256SUMS-linux.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: speech-051-linux-build-log
          path: ${{ runner.temp }}/packages/build.log
