[package]
name = "speech-studio-desktop"
version = "0.3.1"
edition = "2021"
description = "Tauri-оболочка Speech Studio: поднимает speech-server на 127.0.0.1:8797 (SPEECH_STUDIO_PORT) и открывает окно"

[lib]
name = "speech_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"   # авто-обновление: качает подписанный NSIS с GitHub-релиза, ставит в один клик
tauri-plugin-dialog = "2"    # нативный диалог «Обновить? [Обновить] [Позже]»
tauri-plugin-opener = "2"    # opener:default окна; страницу релиза оболочка открывает сама, вне job (spawn_update_check)
tauri-plugin-single-instance = "2"  # второй запуск отдаёт фокус уже открытому окну
tauri-plugin-global-shortcut = "2"  # клавиша Live «держать и говорить» из любого окна
rfd = "0.17"                 # диалог ошибки старта, когда окна Tauri ещё нет
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# axum-бэкенд встроен В ЭТОТ ЖЕ процесс (один exe, без speech-server.exe-сайдкара): serve_blocking с фонового потока.
speech-server = { path = "../../crates/speech-server" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
