[package]
name = "speech-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum-сервис Speech Studio: озвучка (Speech) и распознавание (Listening)"

[dependencies]
tempfile = "3"
trash = "5"
fluent-templates = "0.15.1"
dub-core = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25" }
dub-asr = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25", features = ["cuda"] }
dub-tcpp = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25" }
acpp-server = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25", features = ["langid"] }
dub-llm = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25" }
dub-translate = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25" }
dub-captions = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25" }
dub-sep = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25" }
dub-faces = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
drama = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25" }
hound = "3"
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
tokio = { workspace = true }
tokio-stream = "0.1"
futures-util = "0.3"
async-stream = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
mime_guess = "2"
percent-encoding = "2.3"
# MCP: картинки кадров в ответе инструмента, заголовки =?base64?…?= и границы since/until в часовом поясе компьютера.
base64 = "0.23"
rubato = "5.0.1"
realfft = "3.5"
audioadapter = "5.0.0"
audioadapter-buffers = "5.2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# setup-автозакачка: HTTPS-загрузка компонентов (rustls, без системного OpenSSL) + распаковка zip/wheel.
# rustls: собственный криптопровайдер reqwest (aws-lc-rs) и корни из системного хранилища сертификатов.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "stream"] }
# Многопоточная (aria2-style) загрузка byte-range'ами через ureq (метод Higgs-Ultimate). HF Xet-CAS отдаёт
# 206 на Range-запросы с ureq-UA (reqwest/curl-UA душит 403). Параллельные диапазоны сатурируют канал HF CDN.
ureq = { version = "3", features = ["socks-proxy", "platform-verifier"] }   # socks-proxy: без него socks5:// паникует «Enable feature socks-proxy»
zip = { version = "8", default-features = false, features = ["deflate"] }
csv = "1.4"
text2num = "2.8"
# Linux-сборки движков приходят tar.gz (llama.cpp, onnxruntime) и tar.xz (ffmpeg, BSRoformer, NVIDIA redist).
tar = "0.4"
flate2 = "1"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "optimization", "xz"] }
# монитор ресурсов: GPU через NVML, RAM/CPU через sysinfo.
nvml-wrapper = "0.13"
sysinfo = "0.39"
# запись голоса с микрофона (нативный cpal + hound-WAV).
cpal = "0.18"
# нативный диалог выбора папки (импорт готовых моделей без докачки; на Windows — Win32, без GTK).
rfd = "0.17"
# content-addressable per-stage кэш (analyze::cache): лёгкий, чистый хэш без C-зависимостей.
# Префикс-хэш длинных wav (первые+последние N байт + размер) — быстрый ключ инвалидации стадий.
blake3 = "1"
# SHA-256 скачанных моделей и движков против закреплённых хэшей (HF lfs.oid, digest GitHub, PyPI/NVIDIA).
sha2 = "0.11"
# Studio Hub: anonymous statistics and the news feed (telemetry only after the first-run screen showed its choice).
vs-providers = { git = "https://github.com/timoncool/videosos", rev = "03eabb3d4dbcaa345d81ce196e9c8b7ec7264c8a" }
# FLAC (libFLAC) and MP3 (LAME) encoders and their tags, as the music studios write them
audio-post = { git = "https://github.com/timoncool/YuE2-Studio", rev = "ce206f1ac5089daecead8d5cfccc60f533db78b3" }
lofty = "0.25.4"
studio-hub-client = { git = "https://github.com/timoncool/studio-hub-client", rev = "365c2b757bfddd45fff67e7264b41f4f961a0032" }
# чистка текста перед синтезом (tts_text.rs): теги звуков, разметка, метки спикеров.
regex = "1"
# ударения и омографы (stress.rs): ONNX-сети RUAccent на той же onnxruntime 1.28, что ASR, их токенизатор и словарь как FST.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "tracing", "api-28", "cuda"] }
# the director's check of a rewritten text: NFKC of its letters.
unicode-normalization = "0.1"
# Qwen3-TTS: qwentts.cpp's C ABI loaded at run time.
libloading = "0.9"
subtle = "2.6"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
fst = "0.4"
# словарь произношения (pron_dict.rs): правила Balabolka REX с обратными ссылками и границами слов.
fancy-regex = "0.19"
# нормализация русского (normalize_ru.rs): числительные с падежом и родом — порт num2words (LGPL-2.1).
num2words2-core = "0.1"
num-bigint = "0.4"
# импорт книг (book_import.rs): EPUB, PDF с оглавлением, DOCX, HTML, Markdown, FB2, TXT в любой кодировке.
rbook = "0.7"
pdf-extract = "0.12"
lopdf = "0.45"
docx-rs = "0.4"
scraper = "0.27"
ego-tree = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
roxmltree = "0.21"
chardetng = "0.1"
encoding_rs = "0.8"
rust-genai = { version = "=0.3.1", default-features = false }

# job object с kill-on-close: сайдкары не переживают студию (process_group.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

# Linux: CUDA driver API из libcuda.so.1 (hw.rs) через dlopen.
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
# Поддельный HTTP-сервер для тестов провайдеров.
dub-llm = { git = "https://github.com/timoncool/dub-studio", rev = "33a39d1cef8f7d386fb8eb5ae29a3f27da583b25", features = ["test-support"] }

# The README download tables (scripts/readme-downloads.rs), checked or rewritten from what the app downloads.
[[example]]
name = "readme-downloads"
path = "../../scripts/readme-downloads.rs"
